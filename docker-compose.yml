services:
  gg-studio:
    build: .
    image: gg-studio:latest
    restart: unless-stopped
    ports:
      # cổng bên ngoài lấy từ .env (HOST_PORT, mặc định 4041); bên trong container luôn là 3000.
      # Service khác cùng docker network gọi http://gg-studio:3000
      - "${BIND_ADDR:-0.0.0.0}:${HOST_PORT:-4041}:3000"
    environment:
      # BẮT BUỘC đặt khi chạy trong mạng nội bộ: key lưu plaintext, UI có nút hiện key
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      PROXY_TOKEN: ${PROXY_TOKEN:?set PROXY_TOKEN in .env}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-4}
      ROUTER_DEADLINE_MS: ${ROUTER_DEADLINE_MS:-45000}
      MAX_INFLIGHT_PER_KEY: ${MAX_INFLIGHT_PER_KEY:-4}
      OVERLOAD_THRESHOLD: ${OVERLOAD_THRESHOLD:-3}
      OVERLOAD_PAUSE_MS: ${OVERLOAD_PAUSE_MS:-15000}
      # Địa chỉ hiện trong lệnh curl mẫu ở màn hình Client keys (không ảnh hưởng tới việc chạy)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-http://gg-studio:3000}
      # Redis giữ bộ đếm quota + cooldown (bắt buộc). Mặc định dùng service gg-redis bên dưới.
      REDIS_URL: ${REDIS_URL:-redis://gg-redis:6379}
      REDIS_PREFIX: ${REDIS_PREFIX:-gg:}
    depends_on:
      gg-redis:
        condition: service_healthy
    volumes:
      - gg-data:/app/data
    networks:
      default:
      # Mạng dùng chung với các stack khác trên cùng máy (vd Logis): bên đó gọi http://gg-studio:3000/v1
      shared:
        aliases:
          - gg-studio

  # Chỉ nằm trên network mặc định của stack này (không gắn vào network dùng chung), không mở cổng ra ngoài.
  gg-redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF: restart Redis không mất bộ đếm hôm nay và cooldown
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - gg-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gg-data:
  gg-redis:

networks:
  # Phải có sẵn trước khi deploy: chạy `docker network create proxy_net` một lần trên máy.
  # external nên deploy/down không bao giờ xoá nó. Đổi tên qua SHARED_NETWORK nếu cần.
  shared:
    name: ${SHARED_NETWORK:-proxy_net}
    external: true
